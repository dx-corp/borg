[package]
name = "borg"
version = "0.1.0"
edition = "2024"
license = "BUSL-1.1"
rust-version = "1.95"
publish = false
repository = "https://github.com/dx-corp/borg"
description = "Self-organizing CI fleet agent: drones probe their host and run ephemeral runners that a queen leases to them."

[lib]
name = "borg"
path = "src/lib.rs"

[[bin]]
name = "borg"
path = "src/main.rs"
test = false

[dependencies]
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
jsonwebtoken = { version = "10.3", default-features = false, features = ["aws_lc_rs", "use_pem"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "process", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
aws-lc-rs = "1.18"
base64 = "0.22"
tempfile = "3.14"

[lints.rust]
non_ascii_idents = "deny"
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
unused_lifetimes = "warn"

[lints.clippy]
await_holding_lock = "deny"
dbg_macro = "deny"
disallowed_methods = "deny"
empty_drop = "deny"
exit = "deny"
filetype_is_file = "deny"
fn_to_numeric_cast_any = "deny"
lossy_float_literal = "deny"
mem_forget = "deny"
mutex_atomic = "deny"
rc_buffer = "deny"
rest_pat_in_fully_bound_structs = "deny"
string_add = "deny"
string_lit_as_bytes = "deny"
todo = "deny"
unchecked_time_subtraction = "deny"
undocumented_unsafe_blocks = "deny"
verbose_file_reads = "deny"
